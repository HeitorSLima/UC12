<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="./assets/styles/index.css">
</head>
<body>
    <div class="calc">
        <div class="display" id="disp"></div>
        <div class="buttons">
            <button class="num" id="btn1">1</button>
            <button class="num" id="btn2">2</button>
            <button class="num" id="btn3">3</button>
            <button class="op" id="btnSoma">+</button>

            <button class="num" id="btn4">4</button>
            <button class="num" id="btn5">5</button>
            <button class="num" id="btn6">6</button>
            <button class="op" id="btnSub">-</button>

            <button class="num" id="btn7">7</button>
            <button class="num" id="btn8">8</button>
            <button class="num" id="btn9">9</button>
            <button class="op" id="btnMulti">*</button>

            <button class="clear" id="btnClear">C</button>
            <button class="num" id="btn0">0</button>
            <button class="equals" id="btnEq">=</button>
            <button class="op" id="btnDivide">/</button>
        </div>
    </div>

    <script src="./assets/scripts/script.js"></script>
</body>
</html>
